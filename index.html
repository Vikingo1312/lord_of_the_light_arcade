    <meta charset="UTF-8">
    <title>KEANO ROMEO — LORD OF THE LIGHT I ⚔️ (V2.0 ENGINE)</title>
    <script>
        (function () {
            try {
                var host = window.location.hostname || '';
                var isLocal = (host === 'localhost' || host === '127.0.0.1' || host.indexOf('192.168.') === 0 || host.endsWith('.local'));
                var allSpecials = ['Vikingo', 'VikingoRaw', 'SupremeKeano', 'HyperKeano', 'JayX', 'GargamelHoodie', 'Simba', 'Emely', 'HyperEmely', 'Cayle', 'CayleMinogue', 'Annikina', 'Dom', 'AliAbi'];
                var params = new URLSearchParams(window.location.search || '');
                var claimToken = params.get('claim') || '';
                var macKey = params.get('mac_key') || '';

                function unlockAllForJanMac() {
                    localStorage.setItem('lotl_jan_ip_verified', 'true');
                    localStorage.setItem('lotl_story_complete', 'true');
                    for (var i = 0; i < allSpecials.length; i++) {
                        localStorage.setItem('unlock_' + allSpecials[i], 'true');
                    }
                }

                // Clear any old legacy Vercel VIP flags on public devices
                if (!isLocal && !localStorage.getItem('lotl_jan_ip_verified')) {
                    if (localStorage.getItem('lotl_vip_jan') || localStorage.getItem('lotl_vip_emy') || localStorage.getItem('lotl_vip_dom') || localStorage.getItem('lotl_vip_annikina')) {
                        localStorage.removeItem('lotl_vip_jan');
                        localStorage.removeItem('lotl_vip_emy');
                        localStorage.removeItem('lotl_vip_dom');
                        localStorage.removeItem('lotl_vip_annikina');
                        for (var k = 0; k < allSpecials.length; k++) {
                            localStorage.removeItem('unlock_' + allSpecials[k]);
                        }
                    }
                }

                if (isLocal && !localStorage.getItem('lotl_clean_progression')) {
                    unlockAllForJanMac();
                }

                // 0) Direct Ali Abi Showcase Link (?ali=1 or ?show=ali):
                // Locks ALL other secret characters so everything must be unlocked via Story/Arcade, EXCEPT AliAbi AND Arcade Mode are unlocked!
                var showAliOnly = (params.get('ali') === '1' || params.get('show') === 'ali');
                if (showAliOnly) {
                    localStorage.setItem('lotl_clean_progression', 'true');
                    localStorage.removeItem('lotl_jan_ip_verified');
                    localStorage.removeItem('lotl_vip_jan');
                    for (var m = 0; m < allSpecials.length; m++) {
                        localStorage.removeItem('unlock_' + allSpecials[m]);
                        localStorage.removeItem('lotl_single_claim_' + allSpecials[m]);
                    }
                    localStorage.setItem('lotl_story_complete', 'true');
                    localStorage.setItem('unlock_AliAbi', 'true');
                    localStorage.setItem('lotl_single_claim_AliAbi', 'true');
                }

                // 1) One-Time Single-Use Invite Link (e.g. ?claim=ali-abi-vip-7788 -> unlocks ONLY AliAbi + Arcade Mode once!)
                if (claimToken) {
                    for (var c = 0; c < allSpecials.length; c++) {
                        if (allSpecials[c] !== 'AliAbi') {
                            localStorage.removeItem('unlock_' + allSpecials[c]);
                        }
                    }
                    localStorage.setItem('lotl_story_complete', 'true');
                    localStorage.setItem('unlock_AliAbi', 'true');
                    localStorage.setItem('lotl_single_claim_AliAbi', 'true');
                    fetch('/api/lotl/claim?token=' + encodeURIComponent(claimToken), { cache: 'no-store' })
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                            if (d && d.ok && d.unlockId) {
                                localStorage.setItem('lotl_story_complete', 'true');
                                localStorage.setItem('unlock_' + d.unlockId, 'true');
                                localStorage.setItem('lotl_single_claim_' + d.unlockId, 'true');
                                alert('🫲 ALI ABI 🫱 & DER ARCADE-MODUS WURDEN FÜR DICH FREIGESCHALTET!\n\nAlle anderen Geheimkämpfer kannst du dir jetzt mit Ali Abi im Arcade-Modus erspielen! Viel Spaß im Döner-Palast!');
                            } else if (d && d.reason === 'already_used') {
                                localStorage.removeItem('unlock_AliAbi');
                                localStorage.removeItem('lotl_single_claim_AliAbi');
                                alert('⚠️ DIESER EINMAL-LINK WURDE BEREITS BENUTZT!\n\nEinmal-Links können nur ein einziges Mal angeklickt werden.');
                            }
                        })
                        .catch(function () {});
                }

                // 2) Master Unlock or Server-side IP check for Jan's PC / Mac:
                if (!showAliOnly && !claimToken) {
                    if (params.get('reset_jan') === '1' || macKey === 'vikingo40-mac-master-1312') {
                        localStorage.removeItem('lotl_clean_progression');
                        unlockAllForJanMac();
                    }
                    fetch('/api/lotl/access' + (macKey ? ('?mac_key=' + encodeURIComponent(macKey)) : ''), { cache: 'no-store' })
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                            if (d && d.isJanMac && !localStorage.getItem('lotl_clean_progression')) {
                                unlockAllForJanMac();
                            }
                        })
                        .catch(function () {});
                }

                if (window.location.search && window.history && window.history.replaceState) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch (e) {}
        })();
    </script>

            top: 50%;
            left: 50%;
            right: auto;
            bottom: auto;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
        }

        /* The main WebGL/2D Canvas */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: #000;

    <script>
        (function () {
            const ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? navigator.userAgent : '';
            const isMobileUA = /iPhone|iPod|iPad|Android.*Mobile|Windows Phone|webOS|BlackBerry/i.test(ua)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && window.screen && Math.min(window.screen.width, window.screen.height) <= 1024);
            const isCoarsePrimary = (typeof window !== 'undefined' && window.matchMedia)
                ? (window.matchMedia('(pointer: coarse) and (hover: none)').matches && Math.min(window.screen.width, window.screen.height) <= 950)
                : false;
            const isTouchDevice = Boolean(isMobileUA || isCoarsePrimary);
            const container = document.getElementById('game-container');

            function updateOrientationLayout() {
                if (!container) return;
                // On mobile/touch devices held in portrait (or when iOS Portrait Lock is on),
                // automatically rotate the game container 90deg into landscape so it fills 100% of the screen!
                if (isTouchDevice && window.innerHeight > window.innerWidth) {
                    container.classList.add('force-landscape');
                } else {
                    container.classList.remove('force-landscape');
                }
                window.scrollTo(0, 1);
            }

            // Accurate touch/click mapping that handles both standard landscape and 90deg .force-landscape rotation
            // Supports both (clientX, clientY, canvas) and (canvas, clientX, clientY)
            window.mapTouchToCanvas = function (arg1, arg2, arg3) {
                let clientX, clientY, c;
                if (arg1 && typeof arg1.getBoundingClientRect === 'function') {
                    c = arg1;
                    clientX = arg2;
                    clientY = arg3;
                } else {
                    clientX = arg1;
                    clientY = arg2;
                    c = arg3 || document.getElementById('gameCanvas');
                }
                if (!c) return { x: clientX, y: clientY };
                const rect = c.getBoundingClientRect();
                const isRotated = container && container.classList.contains('force-landscape');
                if (isRotated) {
                    const relX = (clientY - rect.top) / Math.max(1, rect.height);
                    const relY = (rect.right - clientX) / Math.max(1, rect.width);
                    return {
                        x: Math.max(0, Math.min(c.width, relX * c.width)),
                        y: Math.max(0, Math.min(c.height, relY * c.height))
                    };
                }
                return {
                    x: (clientX - rect.left) * (c.width / Math.max(1, rect.width)),
                    y: (clientY - rect.top) * (c.height / Math.max(1, rect.height))
                };
            };

            window.toggleGameFullscreen = function () {
                const docEl = document.documentElement;
                const reqFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
                const exitFs = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                const fsEl = document.fullscreenElement || document.webkitFullscreenElement;

                if (reqFs) {
                    if (!fsEl) {
                        Promise.resolve(reqFs.call(docEl)).then(() => {
                            if (screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('landscape').catch(() => {});
                            }
                        }).catch(() => {
                            updateOrientationLayout();
                        });
                    } else if (exitFs) {
                        Promise.resolve(exitFs.call(document)).catch(() => {});
                    }
                } else {
                    // iPhone iOS Safari does not provide element.requestFullscreen()
                    updateOrientationLayout();
                    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
                    if (!isStandalone) {
                        const toast = document.getElementById('ios-fs-toast');
                        if (toast) {
                            toast.classList.remove('hidden');
                            clearTimeout(window.__iosToastTimer);
                            window.__iosToastTimer = setTimeout(() => toast.classList.add('hidden'), 6500);
                        }
                    }
                }
            };

            if (isTouchDevice) {
                document.getElementById('mobile-menu-btn').style.display = 'flex';
                document.getElementById('mobile-fs-btn').style.display = 'flex';
                updateOrientationLayout();
                window.addEventListener('resize', updateOrientationLayout);
                window.addEventListener('orientationchange', () => setTimeout(updateOrientationLayout, 120));
            }

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js?v=2.72').catch(() => {});
                });
            }

            // Live Auto-Update Checker: Polls version.json from the server and prompts the player when a new update is live!
            window.LOTL_CURRENT_VERSION = '2.72';
            async function checkLiveGameUpdate() {
                try {
                    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    const dismissedVer = sessionStorage.getItem('lotl_dismissed_update_ver');
                    if (data && data.version && data.version !== window.LOTL_CURRENT_VERSION && data.version !== dismissedVer) {
                        if (!document.getElementById('lotl-update-banner')) {
                            const bar = document.createElement('div');
                            bar.id = 'lotl-update-banner';
                            bar.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;background:linear-gradient(135deg,#0d1428,#1a0b2e);border:2px solid #00ff88;border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 0 28px rgba(0,255,136,0.45);font-family:Orbitron,sans-serif;color:#fff;';
                            bar.innerHTML = '<div><div style="color:#00ff88;font-weight:900;font-size:13px;">⚡ NEUES SPIEL-UPDATE VERFÜGBAR (v' + data.version + ')!</div><div style="font-size:11px;color:#ccd6f6;margin-top:2px;">' + (data.notes || 'Neue Fixes & Inhalte bereit!') + '</div></div><button onclick="sessionStorage.setItem(\'lotl_dismissed_update_ver\',\'' + data.version + '\');if(window.caches){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}setTimeout(()=>{window.location.href=window.location.pathname+\'?v=' + data.version + '\';},150);" style="background:linear-gradient(135deg,#00c853,#009624);color:#fff;border:1.5px solid #69f0ae;border-radius:8px;padding:9px 16px;font:bold 12px Orbitron,sans-serif;cursor:pointer;white-space:nowrap;">🔄 JETZT AKTUALISIEREN</button><button onclick="sessionStorage.setItem(\'lotl_dismissed_update_ver\',\'' + data.version + '\');document.getElementById(\'lotl-update-banner\').remove();" style="background:transparent;color:#aaa;border:none;font:bold 16px sans-serif;cursor:pointer;padding:4px 8px;">✕</button>';
                            document.body.appendChild(bar);
                        }
                    }
                } catch (e) {}
            }
            setTimeout(checkLiveGameUpdate, 4000);
            setInterval(checkLiveGameUpdate, 45000);
        })();
    </script>
